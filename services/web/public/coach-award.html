<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lamberson Coach Award Nomination — GPSA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://css.gpsaswimming.org/gpsa-tools-common.css">
  <link rel="stylesheet" href="/award.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <img src="https://assets.gpsaswimming.org/img/gpsa_logo.png" alt="GPSA logo" onerror="this.style.display='none'">
      <h1>Kei Lamberson Coach Award</h1>
    </div>
  </header>

  <main class="container">
    <p><a class="back-link" href="/">&larr; All awards</a></p>
    <div id="closed-notice" class="notice" hidden>Nominations for this award are closed.</div>

    <form id="award-form" data-award="lamberson" class="form-card" novalidate>
      <p class="prompt" data-prompt="lamberson" style="margin-bottom:1.5rem">
        &ldquo;How has your coach demonstrated joy, compassion and companionship in connecting with
        all swimmers on your team this summer?&rdquo;
      </p>

      <div class="field">
        <label for="coachName">Name of nominated coach <span class="req">*</span></label>
        <input id="coachName" name="coachName" type="text" required>
      </div>
      <div class="field">
        <label for="pool">Pool represented <span class="req">*</span></label>
        <select id="pool" name="pool" required data-teams></select>
      </div>
      <div class="two-col">
        <div class="field">
          <label for="essayWriterName">Name of essay writer <span class="req">*</span></label>
          <input id="essayWriterName" name="essayWriterName" type="text" required autocomplete="name">
        </div>
        <div class="field">
          <label for="relationshipToCoach">Relationship to coach <span class="req">*</span></label>
          <input id="relationshipToCoach" name="relationshipToCoach" type="text" required>
        </div>
      </div>
      <div class="field">
        <label for="telephone">Telephone (of essay writer) <span class="req">*</span></label>
        <input id="telephone" name="telephone" type="tel" required autocomplete="tel">
      </div>

      <div class="field">
        <label for="essay">Essay <span class="req">*</span></label>
        <textarea id="essay" name="essay" required data-min="250" data-max="750"></textarea>
        <div class="hint">Minimum 250, maximum 750 words. <span class="wordcount" id="wordcount">0 words</span></div>
      </div>

      <div class="field" id="turnstile"></div>

      <button class="btn btn-red" type="submit" id="submit">Submit nomination</button>
    </form>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
