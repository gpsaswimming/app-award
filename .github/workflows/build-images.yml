name: build-images

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install (api)
        working-directory: services/api
        run: npm ci
      - name: Test (api)
        working-directory: services/api
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/gpsaswimming/app-award-${{ matrix.service }}:latest
            ghcr.io/gpsaswimming/app-award-${{ matrix.service }}:${{ github.sha }}
