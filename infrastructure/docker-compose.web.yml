# DMZ tier — runs on the DMZ node. Zero credentials (.env holds no secrets).
# The edge routes the awards site to :8080 here.
services:
  app-award-web:
    image: ghcr.io/gpsaswimming/app-award-web:latest
    container_name: app-award-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
