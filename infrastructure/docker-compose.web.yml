# DMZ tier — runs on the DMZ node. Zero credentials (web.env holds no secrets).
# The edge routes award.gpsaswimming.org to :8080 here.
services:
  app-award-web:
    image: ghcr.io/gpsaswimming/app-award-web:latest
    container_name: app-award-web
    restart: unless-stopped
    env_file:
      - web.env
    ports:
      - "8080:8080"
